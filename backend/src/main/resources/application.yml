server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 1h
      cookie:
        http-only: true
        same-site: lax

app:
  auth:
    username: ${APP_USERNAME:consultaCE}
    password: ${APP_PASSWORD:changeme}

api:
  consulta:
    base-url: ${API1_URL}
    username: ${API1_USERNAME}
    password: ${API1_PASSWORD}
  consulta2:
    base-url: ${API2_URL}
    username: ${API2_USERNAME}
    password: ${API2_PASSWORD}
    cpf-usuario: ${API2_CPF_USUARIO}

spring:
  cloud:
    openfeign:
      okhttp:
        enabled: false
      httpclient:
        enabled: true
