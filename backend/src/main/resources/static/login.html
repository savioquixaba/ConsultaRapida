<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>ConsultaRapida - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070b14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background-image:
        radial-gradient(ellipse 60% 40% at 50% -5%, rgba(0, 128, 255, 0.16), transparent),
        radial-gradient(ellipse 40% 30% at 85% 110%, rgba(124, 58, 237, 0.1), transparent),
        radial-gradient(ellipse at top, hsl(215 50% 12%), #070b14);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      padding-top: 5rem;
    }
    .wrap { width: 100%; max-width: 24rem; padding-bottom: 4rem; animation: rise 0.5s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .hero { text-align: center; margin-bottom: 1.75rem; }
    .icon-tile {
      display: inline-flex; align-items: center; justify-content: center;
      width: 3.5rem; height: 3.5rem; border-radius: 1rem;
      background: linear-gradient(135deg, rgba(0, 128, 255, 0.25), rgba(0, 128, 255, 0.06));
      border: 1px solid rgba(0, 128, 255, 0.35);
      box-shadow: 0 0 28px rgba(0, 128, 255, 0.35);
      margin-bottom: 0.75rem;
    }
    .hero h1 { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.025em; }
    .hero p { font-size: 0.875rem; color: #94a3b8; margin-top: 0.5rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.72rem; font-weight: 600; color: #7dd3a8;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 999px; padding: 0.25rem 0.7rem; margin-top: 0.75rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid #26334d;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 128, 255, 0.06);
    }
    .card.shake { animation: shake 0.4s ease; }
    @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.45rem; }
    .input-wrap { position: relative; }
    .input-wrap svg.lead {
      position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
      color: #64748b; pointer-events: none;
    }
    .field input {
      width: 100%; padding: 0.7rem 0.75rem 0.7rem 2.5rem;
      font-size: 0.9rem; color: #e2e8f0;
      background: #141d31; border: 1px solid #26334d;
      border-radius: 0.75rem; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input::placeholder { color: #475569; }
    .field input:focus { border-color: #0080ff; box-shadow: 0 0 0 3px rgba(0, 128, 255, 0.25); }
    .eye {
      position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #64748b; padding: 0.25rem;
      display: flex; align-items: center;
    }
    .eye:hover { color: #cbd5e1; }
    .btn {
      width: 100%; padding: 0.75rem; font-size: 0.9rem; font-weight: 700; color: #fff;
      background: linear-gradient(180deg, #1a9bff, #0077e6);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 0.75rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      box-shadow: 0 6px 20px rgba(0, 128, 255, 0.35);
      transition: filter 0.15s, transform 0.05s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.8; cursor: wait; }
    .spinner {
      width: 1rem; height: 1rem; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4); border-top-color: #fff;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert {
      display: none; font-size: 0.82rem; border-radius: 0.75rem;
      padding: 0.7rem 0.8rem; margin-bottom: 1rem; border: 1px solid;
      align-items: center; gap: 0.5rem;
    }
    .alert.show { display: flex; }
    .alert.error { color: #fca5a5; background: rgba(230, 25, 25, 0.1); border-color: rgba(230, 25, 25, 0.4); }
    .alert.info { color: #bae6fd; background: rgba(0, 128, 255, 0.1); border-color: rgba(0, 128, 255, 0.4); }
    .hint { text-align: center; font-size: 0.72rem; color: #475569; margin-top: 1rem; }
    footer {
      position: fixed; bottom: 0; width: 100%; text-align: center;
      padding: 0.75rem; font-size: 0.75rem; color: #94a3b8;
      background: rgba(7, 11, 20, 0.5); backdrop-filter: blur(8px);
      border-top: 1px solid #26334d;
    }
    footer .links { display: flex; align-items: center; justify-content: center; gap: 0.85rem; margin-top: 0.5rem; }
    footer .links a { color: #94a3b8; transition: color 0.15s; display: inline-flex; }
    footer .links a:hover { color: #e2e8f0; }
    footer .heart { color: #ef4444; }
    footer .dev { font-weight: 500; color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="icon-tile">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38a5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>ConsultaRapida</h1>
      <p>Acesso restrito &mdash; fa&ccedil;a login para continuar</p>
      <div><span class="badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>
        </svg>
        Ambiente seguro
      </span></div>
    </div>
    <div class="card" id="card">
      <div id="msg-error" class="alert error">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
        <span>Usu&aacute;rio ou senha inv&aacute;lidos.</span>
      </div>
      <div id="msg-info" class="alert info">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span>Sess&atilde;o encerrada. Fa&ccedil;a login novamente.</span>
      </div>
      <form method="post" action="/login" id="form">
        <div class="field">
          <label for="username">Usu&aacute;rio</label>
          <div class="input-wrap">
            <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="username" name="username" type="text" placeholder="Digite seu usuário" autocomplete="username" autofocus required />
          </div>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <svg class="lead" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required style="padding-right: 2.5rem;" />
            <button type="button" class="eye" id="eye" title="Mostrar senha">
              <svg id="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-closed" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
            </button>
          </div>
        </div>
        <button class="btn" type="submit" id="btn">
          <span class="spinner" id="spinner"></span>
          <svg id="btn-lock" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span id="btn-text">Entrar com segurança</span>
        </button>
      </form>
      <p class="hint">Sess&atilde;o expira automaticamente após 1 hora de uso.</p>
    </div>
  </div>
  <footer>
    <p>Desenvolvido com <span class="heart">&hearts;</span> por <span class="dev">S&aacute;vio Quixaba</span></p>
    <div class="links">
      <a href="https://github.com/savioquixaba" target="_blank" rel="noopener noreferrer" title="GitHub">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.73.083-.73 1.205.085 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12 24 5.37 18.63 0 12 0z"/></svg>
      </a>
      <a href="https://quixabadev.vercel.app/" target="_blank" rel="noopener noreferrer" title="Portfólio">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      </a>
      <a href="https://linkedin.com/in/savioquixaba" target="_blank" rel="noopener noreferrer" title="LinkedIn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
    </div>
  </footer>
  <script>
    var q = new URLSearchParams(window.location.search);
    if (q.has("error")) {
      document.getElementById("msg-error").classList.add("show");
      document.getElementById("card").classList.add("shake");
    } else if (q.has("logout")) {
      document.getElementById("msg-info").classList.add("show");
    }
    var pwd = document.getElementById("password");
    document.getElementById("eye").onclick = function () {
      var show = pwd.type === "password";
      pwd.type = show ? "text" : "password";
      document.getElementById("eye-open").style.display = show ? "none" : "";
      document.getElementById("eye-closed").style.display = show ? "" : "none";
      this.title = show ? "Ocultar senha" : "Mostrar senha";
    };
    document.getElementById("form").onsubmit = function () {
      document.getElementById("spinner").style.display = "inline-block";
      document.getElementById("btn-lock").style.display = "none";
      document.getElementById("btn-text").textContent = "Entrando...";
      document.getElementById("btn").disabled = true;
    };
  </script>
</body>
</html>
